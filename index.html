<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpticalWorks</title>
<meta name="description" content="OpticalWorks makes calm puzzle games for Android.">
<style>
  :root { --bg: #f5f5f2; --text: #1d2a23; --soft: #4d5c54; --line: #d5ddd8; --accent: #3f6e57; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a17; --text: #e6ece8; --soft: #a9b6ae; --line: #2c3631; --accent: #8fbfa0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 34px; margin: 0; letter-spacing: 0.04em; }
  .soft { color: var(--soft); margin-top: 4px; }
  .game { margin-top: 36px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; }
  .game h2 { font-size: 22px; margin: 0 0 6px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>OpticalWorks</h1>
<p class="soft">Calm puzzle games for Android.</p>

<div class="game">
  <h2>Arrow Oasis: Escape Puzzle</h2>
  <p>Tap the arrows out of the board, one free path at a time, among calm themes and music.</p>
  <p><a href="arrow-oasis-privacy.html">Privacy policy</a></p>
</div>

<p class="soft" style="margin-top: 36px">Contact: <a href="mailto:opticalworks@proton.me">opticalworks@proton.me</a></p>
</main>
</body>
</html>
